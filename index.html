<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Cloud Hopper – jednoduchá Flappy Bird-like hra do prohlížeče." />
    <title>Cloud Hopper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-label="Cloud Hopper hra">
        <div class="topbar">
          <div>
            <p class="eyebrow">CLOUD HOPPER</p>
            <p class="hint">Tap / klik / mezerník</p>
          </div>
          <button id="soundButton" class="icon-button" type="button" aria-label="Vypnout zvuk" title="Zvuk">🔊</button>
        </div>

        <canvas
          id="gameCanvas"
          width="360"
          height="640"
          aria-label="Herní plocha Cloud Hopper"
          role="img"
        ></canvas>
      </section>
    </main>

    <script src="game.js" defer></script>
  </body>
</html>
